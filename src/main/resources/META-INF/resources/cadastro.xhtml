<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Arena Match — Cadastro</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />

    <style>
        /* CSS FIEL AO PROTÓTIPO */
        :root{ --card: rgba(255,255,255,0.06); --stroke: rgba(255,255,255,0.10); --text: rgba(255,255,255,0.92); --muted: rgba(255,255,255,0.65); --accent:#25d366; --blue:#3aa0ff; }
        body{ margin:0; font-family: system-ui, -apple-system, sans-serif; color: var(--text); min-height:100vh;
            background: radial-gradient(1200px 700px at 10% 5%, rgba(58,160,255,0.10), transparent 60%),
                        radial-gradient(1200px 700px at 90% 0%, rgba(37,211,102,0.12), transparent 60%),
                        linear-gradient(180deg, rgba(7,11,18,0.96), rgba(7,11,18,0.98));
        }
        .wrap{ max-width: 980px; margin: 0 auto; padding: 1rem; padding-bottom: 6rem; }
        .card{ background: var(--card); border: 1px solid var(--stroke); border-radius: 18px; backdrop-filter: blur(12px); overflow:hidden; }
        .topbar{ padding: 1rem 1.2rem; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.12); }
        .brand{ display:flex; align-items:center; gap:.75rem; }
        .logo{ width:42px; height:42px; border-radius: 14px; display:grid; place-items:center; background: rgba(37,211,102,0.16); border: 1px solid rgba(37,211,102,0.30); }
        .content{ padding: 1.2rem; display:grid; gap: 1rem; }
        
        /* Steps */
        .steps{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:space-between; }
        .step{ flex:1; padding:.7rem .8rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); display:flex; gap:.65rem; align-items:center; cursor:pointer; opacity: 0.6; }
        .step.active{ border-color: rgba(37,211,102,0.30); background: rgba(37,211,102,0.10); opacity: 1; }
        .badgeStep{ width:32px; height:32px; border-radius: 12px; display:grid; place-items:center; border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.18); font-weight: 900; }
        
        /* Form */
        .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
        .field label{ display:block; font-size:.88rem; color: rgba(255,255,255,0.82); margin: 0 0 .35rem; }
        
        /* Overrides Inputs */
        body .ui-inputfield, body .ui-selectonemenu { width:100%; background: rgba(0,0,0,0.20); border: 1px solid rgba(255,255,255,0.12); color: white; border-radius: 14px; padding: .65rem; }
        body .ui-selectonemenu-label { color: white; }
        body .ui-selectonemenu-panel { background: #1a1a1a; border: 1px solid #333; }
        
        /* Footer */
        .wizardFooter{ position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem .9rem; background: rgba(0,0,0,0.85); border-top: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(14px); z-index: 50; }
        .wizardFooter .inner{ max-width: 980px; margin: 0 auto; display:flex; justify-content:space-between; align-items:center; }
        
        /* Buttons */
        .btn { padding:.65rem .85rem; border-radius: 14px; border: 1px solid rgba(37,211,102,0.35); background: rgba(37,211,102,0.95); color:#04110a; font-weight: 900; cursor:pointer; }
        .btn-sec { background: rgba(255,255,255,0.06); color: white; border: 1px solid rgba(255,255,255,0.12); }

        @media (max-width: 900px){ .grid2 { grid-template-columns: 1fr; } }

        .wizardFooter .ui-button {
		    height: 48px;
		    font-weight: 900;
		    border-radius: 14px;
		}
		
		/* Botão Principal (Verde) */
		body .wizardFooter .btn.ui-button {
		    background: rgba(37,211,102,0.95);
		    border: 1px solid rgba(37,211,102,0.35);
		    color: #04110a;
		}
		body .wizardFooter .btn.ui-button:hover {
		    background: #25d366;
		    transform: translateY(-1px);
		}
		
		/* Botão Secundário (Transparente/Glass) */
		body .wizardFooter .btn-sec.ui-button {
		    background: rgba(255,255,255,0.08);
		    border: 1px solid rgba(255,255,255,0.15);
		    color: rgba(255,255,255,0.90);
		}
		body .wizardFooter .btn-sec.ui-button:hover {
		    background: rgba(255,255,255,0.12);
		}
		
		/* Ajuste da Dica (Hint) */
		.hint {
		    font-size: 0.85rem;
		    color: rgba(255,255,255,0.65);
		    margin-bottom: 0.5rem;
		    line-height: 1.4;
		    background: rgba(58,160,255,0.1); /* Um fundinho azul suave */
		    border-left: 3px solid #3aa0ff;
		    padding: 0.5rem 0.8rem;
		    border-radius: 4px;
		}
/* --- CORREÇÃO: Tabela (Grid) Dark --- */
body .ui-datatable .ui-datatable-header,
body .ui-datatable .ui-paginator {
    background: transparent;
    border: none;
}

body .ui-datatable thead th {
    background: rgba(255,255,255,0.12) !important;
    color: rgba(255,255,255,0.9) !important;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 1rem;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 0.85rem;
}

body .ui-datatable tbody td {
    background: rgba(0,0,0,0.2) !important; /* Fundo escuro nas linhas */
    color: rgba(255,255,255,0.85) !important;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0.85rem 1rem;
}

body .ui-datatable .ui-datatable-data > tr {
    background: transparent;
}

/* Hover na linha da tabela */
body .ui-datatable .ui-datatable-data > tr:hover td {
    background: rgba(255,255,255,0.1) !important;
    color: white !important;
}

/* Mensagem de "vazio" */
body .ui-datatable .ui-datatable-empty-message td {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    background: transparent !important;
}

/* --- CORREÇÃO: Botão Lupa (CEP) --- */
/* Remove o azul padrão e deixa integrado ao input */
body .ui-inputgroup .ui-button.btn-cep {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.12);
    border-left: 0; /* Remove borda dupla entre input e botão */
    color: rgba(255,255,255,0.8);
    width: 3rem; /* Largura fixa para o ícone */
}
body .ui-inputgroup .ui-button.btn-cep:hover {
    background: rgba(255,255,255,0.2);
    color: white;
}
/* Ajusta o input para casar com o botão */
body .ui-inputgroup .ui-inputfield {
    border-right: 0; 
}

/* --- CORREÇÃO: Botão Adicionar (Verde) --- */
/* Reforça a classe .btn para garantir que pegue o verde */
body .btn.ui-button {
    background: rgba(37,211,102,0.95) !important;
    border: 1px solid rgba(37,211,102,0.35) !important;
    color: #04110a !important;
    font-weight: 900;
    text-shadow: none;
}
body .btn.ui-button:hover {
    background: #25d366 !important;
    transform: translateY(-1px);
}		
    </style>
</h:head>

<h:body>
    <h:form id="form">
        <p:growl id="growl" showDetail="true"/>

        <div class="wrap">
            <div class="card">
                <div class="topbar">
                    <div class="brand">
                        <div class="logo"><i class="pi pi-bolt"></i></div>
                        <div>
                            <div style="font-weight:900;">Cadastro do Time</div>
                            <div style="opacity:0.6; font-size:0.9rem;">Etapa #{cadastroBean.step + 1} de 3</div>
                        </div>
                    </div>
                </div>

                <div class="content">
                    <div class="steps">
                        <div class="step #{cadastroBean.step == 0 ? 'active' : ''}" onclick="document.getElementById('form:btnS0').click()">
                            <div class="badgeStep">1</div>
                            <div><b>Responsável</b></div>
                        </div>
                        <div class="step #{cadastroBean.step == 1 ? 'active' : ''}" onclick="document.getElementById('form:btnS1').click()">
                            <div class="badgeStep">2</div>
                            <div><b>Time &amp; Local</b></div>
                        </div>
                        <div class="step #{cadastroBean.step == 2 ? 'active' : ''}" onclick="document.getElementById('form:btnS2').click()">
                            <div class="badgeStep">3</div>
                            <div><b>Agenda</b></div>
                        </div>
                        <p:commandButton id="btnS0" action="#{cadastroBean.setStep(0)}" update="@form" style="display:none"/>
                        <p:commandButton id="btnS1" action="#{cadastroBean.setStep(1)}" update="@form" style="display:none"/>
                        <p:commandButton id="btnS2" action="#{cadastroBean.setStep(2)}" update="@form" style="display:none"/>
                    </div>

 					<p:outputPanel rendered="#{cadastroBean.step == 0}">
                        <div class="grid2">
                            <div class="field">
                                <label>Nome Responsável *</label>
                                <p:inputText value="#{cadastroBean.timeDTO.nomeResponsavel}" required="true" requiredMessage="Nome é obrigatório"/>
                            </div>
                            <div class="field">
                                <label>CPF *</label>
                                <p:inputMask mask="999.999.999-99" value="#{cadastroBean.timeDTO.cpf}" required="true" requiredMessage="CPF é obrigatório"/>
                            </div>
                            <div class="field">
                                <label>E-mail (Login) *</label>
                                <p:inputText value="#{cadastroBean.timeDTO.email}" required="true" requiredMessage="E-mail é obrigatório"/>
                            </div>
                            <div class="field">
                                <label>WhatsApp</label>
                                <p:inputMask mask="(99) 99999-9999" value="#{cadastroBean.timeDTO.whatsapp}"/>
                            </div>
                            
                            <div class="field">
                                <label>Senha *</label>
                                <p:password id="senha1" value="#{cadastroBean.timeDTO.senha}" toggleMask="true" 
                                            required="true" requiredMessage="Senha é obrigatória" match="senha2" 
                                            validatorMessage="As senhas digitadas nos campos não conferem (Validação JSF)"/>
                            </div>
                            <div class="field">
                                <label>Confirmar Senha *</label>
                                <p:password id="senha2" value="#{cadastroBean.timeDTO.confirmarSenha}" toggleMask="true" 
                                            required="true" requiredMessage="Confirmação de senha é obrigatória"/>
                            </div>
                        </div>
                    </p:outputPanel>

					 <p:outputPanel rendered="#{cadastroBean.step == 1}">
					    <div class="grid2">
					        <div class="field">
					            <label>Nome do Time *</label>
					            <p:inputText id="nomeTime" value="#{cadastroBean.timeDTO.nomeTime}" 
					                         required="true" requiredMessage="O nome do time é obrigatório." 
					                         placeholder="Ex: Areião FC"/>
					        </div>
					        
					        <div class="field">
					            <label>Mando de Campo *</label>
					            <p:selectOneMenu id="mando" value="#{cadastroBean.timeDTO.mandoCampo}"
					                             required="true" requiredMessage="Selecione o mando de campo.">
					                <f:selectItem itemLabel="Selecione" itemValue=""/>
					                <f:selectItem itemLabel="Sou Visitante" itemValue="VISITANTE"/>
					                <f:selectItem itemLabel="Tenho Mando" itemValue="MANDO"/>
					                <p:ajax listener="#{cadastroBean.atualizarMandoCampo}" update="taxaJogoPanel"/>
					            </p:selectOneMenu>
					        </div>

                            <h:panelGroup id="taxaJogoPanel" layout="block" styleClass="field">
                                <h:panelGroup rendered="#{cadastroBean.timeDTO.mandoCampo == 'MANDO'}" layout="block">
                                    <label>Taxa do jogo <span style="font-weight:normal; opacity:0.6;">(Opcional)</span></label>
                                    <p:inputNumber value="#{cadastroBean.timeDTO.taxaJogo}" symbol="R$ " symbolPosition="p" decimalPlaces="2" minValue="0"/>
                                </h:panelGroup>
                            </h:panelGroup>
					
					        <div class="field">
					            <label>CEP *</label>
					            
					            <div class="hint">
					                <i class="pi pi-info-circle mr-1"></i>
					                Dica: mesmo que o time não tenha uma “casa” fixa, coloque um <b>CEP aproximado</b> da região onde costumam jogar. 
					                Isso é essencial para aparecer nas buscas.
					            </div>
					
							<div class="ui-inputgroup">
							    <p:inputMask id="cep" mask="99999-999" value="#{cadastroBean.timeDTO.cep}" 
							                 required="true" requiredMessage="O CEP é obrigatório."
							                 placeholder="00000-000"/>
							                 
							    <p:commandButton icon="pi pi-search" 
							                     actionListener="#{cadastroBean.buscarCep}" 
							                     process="@this cep" 
							                     update="logradouro cidade uf regiao growl"
							                     styleClass="btn-cep" 
							                     title="Pesquisar Endereço"/>
							</div>
					        </div>
					
					        <div class="field">
					            <label>Endereço (Auto)</label>
					            <p:inputText id="logradouro" value="#{cadastroBean.timeDTO.logradouro}" readonly="true" placeholder="Preenchimento automático"/>
					        </div>
					    </div>
					
					    <div class="grid2" style="margin-top:.5rem;">
					        <div class="field">
					            <label>Número <span style="font-weight:normal; opacity:0.6;">(Opcional)</span></label>
					            <p:inputText id="num" value="#{cadastroBean.timeDTO.numero}" placeholder="S/N"/>
					        </div>
					        
					        <div class="field">
					            <label>Cidade</label>
					            <p:inputText id="cidade" value="#{cadastroBean.timeDTO.cidade}" readonly="true"/>
					        </div>
					        <div class="field">
					            <label>UF</label>
					            <p:inputText id="uf" value="#{cadastroBean.timeDTO.uf}" readonly="true"/>
					        </div>
					        <div class="field">
					            <label>Região</label>
					            <p:inputText id="regiao" value="#{cadastroBean.timeDTO.regiao}" readonly="true"/>
					        </div>
					    </div>
					</p:outputPanel>

                    <p:outputPanel rendered="#{cadastroBean.step == 2}">
                        <div style="background:rgba(255,255,255,0.05); padding:1rem; border-radius:12px;">
                            <div class="grid2">
                                <div class="field">
                                    <label>Dia</label>
                                    <p:selectOneMenu value="#{cadastroBean.novaDisp.diaSemana}">
                                        <f:selectItem itemLabel="Sábado" itemValue="Sábado"/>
                                        <f:selectItem itemLabel="Domingo" itemValue="Domingo"/>
                                        <f:selectItem itemLabel="Segunda" itemValue="Segunda"/>
                                        <f:selectItem itemLabel="Terça" itemValue="Terça"/>
                                        <f:selectItem itemLabel="Quarta" itemValue="Quarta"/>
                                        <f:selectItem itemLabel="Quinta" itemValue="Quinta"/>
                                        <f:selectItem itemLabel="Sexta" itemValue="Sexta"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="field">
                                    <label>Categoria</label>
                                    <p:selectOneMenu value="#{cadastroBean.novaDisp.categoria}">
                                        <f:selectItem itemLabel="Esporte" itemValue="Esporte"/>
                                        <f:selectItem itemLabel="Veterano" itemValue="Veterano"/>
                                        <f:selectItem itemLabel="Master" itemValue="Master"/>
                                    </p:selectOneMenu>
                                </div>
                                <div class="field">
                                    <label>Início</label>
                                    <p:inputMask mask="99:99" value="#{cadastroBean.novaDisp.horaInicio}"/>
                                </div>
                                <div class="field">
                                    <label>Fim</label>
                                    <p:inputMask mask="99:99" value="#{cadastroBean.novaDisp.horaFim}"/>
                                </div>
                            </div>
                           </div> 
						<p:commandButton value="Adicionar Horário" action="#{cadastroBean.adicionarHorario}" 
						                 update="tabelaDisp growl @parent" 
						                 process="@parent"
						                 styleClass="btn" 
						                 icon="pi pi-plus"/>
						
						<p:dataTable id="tabelaDisp" value="#{cadastroBean.timeDTO.disponibilidades}" var="d" 
						             style="margin-top:1rem;" 
						             emptyMessage="Nenhum horário adicionado."
						             reflow="true"> <p:column headerText="Dia">
						        <h:outputText value="#{d.diaSemana}"/>
						    </p:column>
						    
						    <p:column headerText="Categoria">
						        <h:outputText value="#{d.categoria}"/>
						    </p:column>
						    
						    <p:column headerText="Horário">
						        <h:outputText value="#{d.horaInicio} - #{d.horaFim}"/>
						    </p:column>
						    
						    <p:column style="width:60px; text-align:center;">
						        <p:commandButton icon="pi pi-trash" action="#{cadastroBean.removerHorario(d)}" 
						                         update="tabelaDisp" 
						                         process="@this"
						                         styleClass="ui-button-flat ui-button-danger" 
						                         title="Remover"/>
						    </p:column>
						</p:dataTable>
                    </p:outputPanel>
                </div>
            </div>
        </div>

	<div class="wizardFooter">
	    <div class="inner">
	        <p:commandButton value="Voltar" action="#{cadastroBean.back}" update="@form" 
	                         process="@this"
	                         styleClass="btn-sec" icon="pi pi-arrow-left" 
	                         disabled="#{cadastroBean.step == 0}"/>
	        
	        <p:commandButton value="Próximo" action="#{cadastroBean.next}" update="@form growl" 
	                         styleClass="btn" icon="pi pi-arrow-right" iconPos="right" 
	                         rendered="#{cadastroBean.step != 2}"/>
	                         
	        <p:commandButton value="Concluir Cadastro" action="#{cadastroBean.salvar}" update="@form growl" 
	                         styleClass="btn" icon="pi pi-check" iconPos="right" 
	                         rendered="#{cadastroBean.step == 2}"/>
	    </div>
	</div>
    </h:form>
</h:body>
</html>
